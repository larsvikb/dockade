# SPDX-License-Identifier: Apache-2.0
#
# CI gate. Runs the SAME targets as `make check` rather than reimplementing them, so
# there is one definition of "does this repo pass" and a contributor can reproduce a
# CI failure locally with `make check-strict`.
#
# The one thing this file adds is STRICTNESS. Every stage of the gate degrades to a
# SKIP when its tool is missing, which is correct on a dev machine and a trap in CI:
# a runner without hadolint would print `SKIP hadolint` and pass green. So
# DOCKADE_REQUIRE_TOOLS=1 is set for every job, turning a missing tool into a
# failure. See the REQUIRE_TOOLS comment in the Makefile.
#
# Split into two jobs on purpose. `checks` finishes in about a minute; `build`
# compiles five images, two of which are Debian-based sandbox tiers that apt-install
# a whole toolchain. Running them in parallel means a shellcheck typo is not queued
# behind a ten-minute image build.
name: check

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, because this repo floats its tooling ON PURPOSE: ruff.toml pins the rule
  # SELECTION and lets the binary drift ("rebuild-to-update"), and base images are
  # pinned by tag, not digest. The consequence is that a green commit can go red with
  # no code change — a new ruff rule family, a rebuilt python:3.12-slim. A scheduled
  # run is how that surfaces on its own schedule instead of ambushing whoever happens
  # to open the next pull request.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Least privilege: every job here only reads the tree. Nothing publishes, comments,
# or pushes, so no write scope is granted.
permissions:
  contents: read

# A second push to the same ref makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint + consistency + tests
    runs-on: ubuntu-latest
    env:
      DOCKADE_REQUIRE_TOOLS: 1
    steps:
      # v5 targets Node 24. v4 targets Node 20, which GitHub has deprecated and is
      # already force-running on 24 — a warning on every run and a future failure.
      # Credentials are NOT persisted: nothing after checkout needs git auth (the
      # consistency guards use `git ls-files`/`rev-parse`, both local; verify-build
      # touches git not at all), so leaving the token in .git/config for the job's
      # duration buys nothing and widens the window in which a later step could read it.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # ruff and yamllint via pipx, which is how claude-sandbox/Dockerfile installs
      # them too — CI and the agent image get the linters the same way. Unpinned, per
      # the ruff.toml rationale; the scheduled run above is what catches drift.
      # --force because the runner image ALREADY ships yamllint via pipx, so a plain
      # `pipx install` is a silent no-op ("already seems to be installed") and the
      # version would be pinned by the runner image rather than floating from PyPI as
      # the ruff.toml rationale intends. The step should do what it says.
      - name: Install ruff + yamllint
        run: |
          pipx install --force ruff
          pipx install --force yamllint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # hadolint is the one linter this repo PINS (ruff and yamllint float via pipx,
      # here and in the image alike), so the version is read out of the Dockerfile
      # that pins it rather than restated — CI and the sandbox image cannot drift
      # apart, and bumping HADOLINT_VERSION moves both at once. An earlier version
      # of this step fetched releases/latest and failed the gate on two rules that
      # v2.12.0 does not have (DL3064 matching "USER" in `ARG USERNAME=sandbox` as
      # sensitive; DL3066 wanting numeric UIDs, including for `USER root`), while
      # `make check` stayed green locally. A linter version is part of the verdict.
      - name: Install hadolint (version pinned by claude-sandbox/Dockerfile)
        run: |
          version=$(sed -n 's/^ARG HADOLINT_VERSION=//p' claude-sandbox/Dockerfile)
          if [ -z "$version" ]; then
            echo "could not read ARG HADOLINT_VERSION from claude-sandbox/Dockerfile —" >&2
            echo "refusing to silently fall back to 'latest', which is what broke this" >&2
            echo "step before. Did the ARG get renamed or moved?" >&2
            exit 1
          fi
          echo "pinned hadolint: $version"
          sudo curl -fsSL -o /usr/local/bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/$version/hadolint-Linux-x86_64"
          sudo chmod +x /usr/local/bin/hadolint

      # Recorded in the log so a run's verdict can be traced to the exact tool
      # versions that produced it — the necessary counterpart to floating them.
      # shellcheck, python3 and node come with the runner image; strict mode fails
      # loudly rather than skipping if a future image drops one.
      - name: Toolchain versions
        run: |
          shellcheck --version | sed -n 2p
          hadolint --version
          ruff --version
          yamllint --version
          python3 --version
          node --version

      # Not `make check-strict`: verify-build is the `build` job's work, and running
      # it here would serialise the slow half behind the fast half.
      - name: make lint consistency test
        run: make lint consistency test

  build:
    name: every image still builds
    runs-on: ubuntu-latest
    env:
      DOCKADE_REQUIRE_TOOLS: 1
    steps:
      # v5 targets Node 24. v4 targets Node 20, which GitHub has deprecated and is
      # already force-running on 24 — a warning on every run and a future failure.
      # Credentials are NOT persisted: nothing after checkout needs git auth (the
      # consistency guards use `git ls-files`/`rev-parse`, both local; verify-build
      # touches git not at all), so leaving the token in .git/config for the job's
      # duration buys nothing and widens the window in which a later step could read it.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Covers all five Dockerfiles: the three compose services, plus BOTH sandbox
      # tiers via each launcher's --build-only (which builds and exits — no workspace
      # mount, no network, no credentials, so it needs nothing from the runner).
      # No layer cache: see the note in the pull request that added this file.
      - name: make verify-build
        run: make verify-build

      # Filtered to OUR images: the runner image ships a pile of its own (dependabot,
      # gh-aw-firewall, github-mcp-server) which are noise here and read as if this
      # build produced them.
      - name: Image sizes
        if: success()
        run: |
          docker images --format '{{.Repository}}:{{.Tag}}\t{{.Size}}' \
            | grep -E '^(dockade-|claude-sandbox|opencode-sandbox)' | sort
