# SPDX-License-Identifier: Apache-2.0
#
# CI gate. Runs the SAME targets as `make check` rather than reimplementing them, so
# there is one definition of "does this repo pass" and a contributor can reproduce a
# CI failure locally with `make check-strict`.
#
# The one thing this file adds is STRICTNESS. Every stage of the gate degrades to a
# SKIP when its tool is missing, which is correct on a dev machine and a trap in CI:
# a runner without hadolint would print `SKIP hadolint` and pass green. So
# DOCKADE_REQUIRE_TOOLS=1 is set for every job, turning a missing tool into a
# failure. See the REQUIRE_TOOLS comment in the Makefile.
#
# Split into two jobs on purpose. `checks` finishes in about a minute; `build`
# compiles five images, two of which are Debian-based sandbox tiers that apt-install
# a whole toolchain. Running them in parallel means a shellcheck typo is not queued
# behind a ten-minute image build.
#
# The `build` job then STANDS THE STACK UP and runs boundary-check.sh in a real
# sandbox, which is the only automated evidence this repo has that the containment
# boundary still holds — init-firewall.sh is otherwise covered by shellcheck and a
# manual `make boundary`, i.e. a firewall regression is invisible to every other
# check here. It rides on `build` rather than a third job because that job has
# already compiled the images into this runner's daemon; a separate job shares no
# layer cache and would rebuild all five from scratch to run a two-minute check.
name: check

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, because this repo floats its tooling ON PURPOSE: ruff.toml pins the rule
  # SELECTION and lets the binary drift ("rebuild-to-update"), and base images are
  # pinned by tag, not digest. The consequence is that a green commit can go red with
  # no code change — a new ruff rule family, a rebuilt python:3.12-slim. A scheduled
  # run is how that surfaces on its own schedule instead of ambushing whoever happens
  # to open the next pull request.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Least privilege: every job here only reads the tree. Nothing publishes, comments,
# or pushes, so no write scope is granted.
permissions:
  contents: read

# A second push to the same ref makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint + consistency + tests
    runs-on: ubuntu-latest
    env:
      DOCKADE_REQUIRE_TOOLS: 1
    steps:
      # v5 targets Node 24. v4 targets Node 20, which GitHub has deprecated and is
      # already force-running on 24 — a warning on every run and a future failure.
      # Credentials are NOT persisted: nothing after checkout needs git auth (the
      # consistency guards use `git ls-files`/`rev-parse`, both local; verify-build
      # touches git not at all), so leaving the token in .git/config for the job's
      # duration buys nothing and widens the window in which a later step could read it.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # ruff and yamllint via pipx, which is how claude-sandbox/Dockerfile installs
      # them too — CI and the agent image get the linters the same way. Unpinned, per
      # the ruff.toml rationale; the scheduled run above is what catches drift.
      #
      # Into a pipx home of OUR OWN, which is the part worth knowing. The runner image
      # ships its own pipx tools in a shared, ROOT-OWNED PIPX_HOME (/opt/pipx), and
      # yamllint is one of them — so both obvious spellings are wrong there. A plain
      # `pipx install` is a silent no-op ("already seems to be installed"), leaving the
      # version pinned by the runner image rather than floating from PyPI as intended.
      # `pipx install --force` is worse: it tries to recreate a venv it has no
      # permission to remove, declines ("not removing existing venv ... because it was
      # not created in this session"), and fails the job — `Operation not permitted:
      # /opt/pipx/venvs/yamllint/bin/Activate.ps1`. That regressed a green gate.
      #
      # A private PIPX_HOME has neither problem: nothing to collide with, so no --force
      # is needed, and the binaries land where this step says they do rather than
      # wherever the image decided. RUNNER_TEMP is per-job and disposable, so nothing
      # leaks between runs either.
      - name: Install ruff + yamllint
        env:
          PIPX_HOME: ${{ runner.temp }}/pipx
          PIPX_BIN_DIR: ${{ runner.temp }}/pipx/bin
        run: |
          pipx install ruff
          pipx install yamllint
          echo "${{ runner.temp }}/pipx/bin" >> "$GITHUB_PATH"

      # hadolint is the one linter this repo PINS (ruff and yamllint float via pipx,
      # here and in the image alike), so the version is read out of the Dockerfile
      # that pins it rather than restated — CI and the sandbox image cannot drift
      # apart, and bumping HADOLINT_VERSION moves both at once. An earlier version
      # of this step fetched releases/latest and failed the gate on two rules that
      # v2.12.0 does not have (DL3064 matching "USER" in `ARG USERNAME=sandbox` as
      # sensitive; DL3066 wanting numeric UIDs, including for `USER root`), while
      # `make check` stayed green locally. A linter version is part of the verdict.
      - name: Install hadolint (version pinned by claude-sandbox/Dockerfile)
        run: |
          version=$(sed -n 's/^ARG HADOLINT_VERSION=//p' claude-sandbox/Dockerfile)
          if [ -z "$version" ]; then
            echo "could not read ARG HADOLINT_VERSION from claude-sandbox/Dockerfile —" >&2
            echo "refusing to silently fall back to 'latest', which is what broke this" >&2
            echo "step before. Did the ARG get renamed or moved?" >&2
            exit 1
          fi
          echo "pinned hadolint: $version"
          sudo curl -fsSL -o /usr/local/bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/$version/hadolint-Linux-x86_64"
          sudo chmod +x /usr/local/bin/hadolint

      # Recorded in the log so a run's verdict can be traced to the exact tool
      # versions that produced it — the necessary counterpart to floating them.
      # shellcheck, python3 and node come with the runner image; strict mode fails
      # loudly rather than skipping if a future image drops one.
      #
      # The PATHS are printed for the two we install ourselves, because "which yamllint
      # is this?" is precisely the question the pipx-home failure above raised, and the
      # version alone cannot answer it: the image's copy and ours can report the same
      # number while only one of them is floating.
      - name: Toolchain versions
        run: |
          shellcheck --version | sed -n 2p
          hadolint --version
          ruff --version
          yamllint --version
          python3 --version
          node --version
          echo "installed by this job: $(command -v ruff), $(command -v yamllint)"

      # Not `make check-strict`: verify-build is the `build` job's work, and running
      # it here would serialise the slow half behind the fast half.
      - name: make lint consistency test
        run: make lint consistency test

  build:
    name: every image builds + the boundary holds
    runs-on: ubuntu-latest
    # The default job timeout is SIX HOURS. Builds fail fast, but the boundary
    # step stands a stack up and waits on healthchecks and network probes, which
    # is the kind of work that hangs rather than fails. A cold build measures
    # around three minutes, so this is a runaway guard with room to spare.
    timeout-minutes: 30
    env:
      DOCKADE_REQUIRE_TOOLS: 1
    steps:
      # v5 targets Node 24. v4 targets Node 20, which GitHub has deprecated and is
      # already force-running on 24 — a warning on every run and a future failure.
      # Credentials are NOT persisted: nothing after checkout needs git auth (the
      # consistency guards use `git ls-files`/`rev-parse`, both local; verify-build
      # touches git not at all), so leaving the token in .git/config for the job's
      # duration buys nothing and widens the window in which a later step could read it.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Covers all five Dockerfiles: the three compose services, plus BOTH sandbox
      # tiers via each launcher's --build-only (which builds and exits — no workspace
      # mount, no network, no credentials, so it needs nothing from the runner).
      # No layer cache: see the note in the pull request that added this file.
      - name: make verify-build
        run: make verify-build

      # Filtered to OUR images: the runner image ships a pile of its own (dependabot,
      # gh-aw-firewall, github-mcp-server) which are noise here and read as if this
      # build produced them.
      - name: Image sizes
        if: success()
        run: |
          docker images --format '{{.Repository}}:{{.Tag}}\t{{.Size}}' \
            | grep -E '^(dockade-|claude-sandbox|opencode-sandbox)' | sort

      # `make check-boundary` owns the whole lifecycle (compose up, launch a
      # throwaway tier-1 sandbox, run boundary-check.sh inside it as the agent),
      # so this stays a make target for the same reason every other stage does:
      # one definition of the check, reproducible locally with the same command.
      # The images it needs were just built into this runner's daemon above.
      #
      # Known limits of this run, so a green tick is not read as more than it is:
      #   - tier 1 in GOVERNED mode only. Tier 2 needs an iGPU the runner does not
      #     have; standalone mode needs a host with no compose infra, which is
      #     also why the standalone firewall rules stay validated by hand.
      #   - the IPv6 probe self-skips when the runner's container has no v6 stack.
      #   - the lifeline probe needs api.anthropic.com to answer (no credentials —
      #     any HTTP response counts), so a network blip there reads as a failure.
      #     That is the one flake vector: every containment probe needs nothing
      #     external, because the proxy refuses them before it dials.
      #
      # One thing this may cover BETTER than a laptop does: GitHub's runners are
      # Azure VMs, where 169.254.169.254 is a live instance-metadata endpoint and
      # not the dead address it is on a dev machine — so the SSRF/metadata
      # hard-block gets exercised against something that would actually answer. If
      # the proxy logs its metadata-reachability warning at startup here, that is
      # the warning doing its job, not a fault to fix.
      - name: Boundary check (tier 1, governed)
        run: make check-boundary

      # The sandbox side needs no diagnostics step: the check runs as the
      # container's command in the foreground, so the firewall's boot output and
      # every probe result are already in the step above, in order, pass or fail.
      # What is NOT there is the other end of each refusal — the proxy's own view
      # of the policy decision — so pull the infra logs when something failed. The
      # runner is disposable; nothing needs tearing down after.
      - name: Governance-plane logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 || true
