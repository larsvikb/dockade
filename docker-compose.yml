# SPDX-License-Identifier: Apache-2.0
name: dockade

# Shared, long-lived INFRASTRUCTURE (data plane) for the sandbox tiers.
# Bring it up once:
#     docker compose up -d --build
# then start one or more sandboxes against it with run-*-sandbox.sh.
#
# The sandbox containers are intentionally NOT defined here. They are ephemeral,
# per-workspace, and possibly many; the run-*-sandbox.sh launchers start each one
# (`docker run -it --rm`) attached to sandbox-net below, so it keeps its
# interactive TTY, its host-matched uid/gid, and its per-launch DNS/git wiring.
# This file owns only the infrastructure they all share.

networks:
  # The agent's network. internal:true => NO route to the internet for anything
  # on it. The sandbox lives ONLY here, so it has no possible direct egress even
  # if its in-container firewall failed — the egress proxy (dual-homed below) is
  # the sole way off-box. The fixed subnet gives the proxy a stable IP the
  # sandbox firewall allowlists.
  sandbox-net:
    name: sandbox-net
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  # Outbound-only network: the single bridge with real internet egress. ONLY the
  # egress proxy is attached here — nothing else on sandbox-net gets a route out.
  egress-net:
    name: egress-net
    driver: bridge
  # MANAGEMENT path. internal:true => no route off-box. Carries the human-facing
  # control-plane API — approvals, resolve, the read-only views — between the
  # control plane and control-plane-ui, and NOTHING ELSE. The sandbox is never
  # attached (the load-bearing invariant), and neither is the egress proxy: it has
  # its own authorize-net below, so a future control-net tenant (the git or
  # secrets broker) is out of the proxy's reach before it exists. Fixed subnet so
  # boundary-check.sh can probe a literal control-net address and prove the
  # sandbox cannot reach it.
  control-net:
    name: control-net
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24
  # AUTHORIZE path. internal:true. Carries exactly one conversation: the egress
  # proxy asking the control plane to authorize a connection. It exists so that
  # the proxy — the component whose relay guard is best-effort against DNS
  # rebinding, and therefore the one whose bypass this design plans for — has a
  # route to /authorize and no route at all to the management API. The control
  # plane serves the two on separate ports AND separate bind addresses, so
  # membership of this network cannot reach the management listener even by
  # dialing the right port. Both halves are needed: the network split alone would
  # still expose a single all-routes listener here, and the port split alone would
  # sit on a network the proxy can already reach.
  authorize-net:
    name: authorize-net
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24
  # Host-facing UI path for the control-plane-ui frontend ONLY. A non-internal
  # bridge is REQUIRED here because Docker cannot publish a host port from a
  # container that lives solely on an internal network — the publish is silently
  # inert. Masquerade is disabled so this bridge carries the inbound
  # loopback-published UI but is NOT an internet egress path: inbound publishing
  # is DNAT and needs no SNAT, while outbound has no SNAT here so it does not
  # function as egress. This is the reverse-proxy-sidecar split in practice: the
  # control-plane-ui frontend (below) carries this one non-internal surface so the
  # control-plane BACKEND needs no published port and stays control-net-only /
  # fully internal — zero non-internal exposure for the crown jewel. Sandbox never here.
  control-ui-net:
    name: control-ui-net
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

volumes:
  egress-audit:
    name: dockade-egress-audit
  # The policy + audit SQLite store — the crown-jewel state (DESIGN.md). Kept in
  # its own named volume so it survives container/image churn and is backed up
  # independently.
  control-state:
    name: dockade-control-state

services:
  # Governed egress proxy — the central choke point (step 0: CONNECT-level
  # domain allowlist + audit, no TLS interception). See proxies/egress/.
  egress-proxy:
    build:
      context: ./proxies/egress
    image: dockade-egress-proxy
    container_name: egress-proxy
    hostname: egress-proxy
    # `always`, not `unless-stopped`, and only on the three infra services. The two
    # differ in exactly one case: whether a container that was down when the daemon
    # stopped comes back when it starts. That case is not hypothetical here — a
    # normal Windows power cycle left this stack with the control plane exited
    # (containerd recorded exit 128, its "could not determine the status" code, which
    # is what a teardown alongside the VM looks like) while the other services
    # returned. `unless-stopped` will not restart a container it did not observe
    # running at shutdown, so the governance authority stayed down and the proxy
    # came back without it.
    #
    # That specific combination is the worst one available: egress fails closed, so
    # nothing unsafe happens, but every request returns a 403 indistinguishable from
    # a policy denial while `docker compose ps` shows green. See the audit view's
    # handling of `control-plane unreachable, fail-closed`, which is the detection
    # half — this is only the recovery half.
    #
    # The llm-* variants below deliberately keep `unless-stopped`: stopping the model
    # server to reclaim the shared memory pool is an ordinary operator action and it
    # should survive a reboot. These three are substrate and have no such use.
    restart: always
    networks:
      # Serve the sandbox on the internal net at a stable address the sandbox
      # firewall allowlists (matches the launcher's discovery). Keep in-subnet.
      sandbox-net:
        ipv4_address: 172.30.0.10
        priority: 10
      # Reach the internet on the egress net. Higher priority so THIS is the
      # proxy's default route — sandbox-net is internal and has no gateway, so
      # all upstream traffic (and the pinned DNS below) must leave via here.
      egress-net:
        priority: 100
      # Reach the control plane's /authorize listener — and ONLY that listener.
      # Deliberately NOT control-net: this proxy asks policy questions, it never
      # needs the management API, and the whole point of the split is that a
      # bypassed relay guard cannot reach `resolve` and self-approve. Internal, so
      # no bearing on egress; lower priority than egress-net so it never becomes
      # the default route.
      authorize-net:
        priority: 20
    environment:
      # Where the proxy asks for policy decisions. Resolved by name via Docker's
      # embedded DNS (127.0.0.11): `control-plane` gives this container the
      # authorize-net address, because that is the only network the two share.
      # Port 8091 is the authorize listener; 8090 (management) is not served on
      # this network at all.
      EGRESS_CONTROL_PLANE_URL: http://control-plane:8091
    depends_on:
      # service_healthy, not the bare "started" form. The addon fails CLOSED when
      # the control plane is unreachable (addon.py `_authorize`), so a proxy that
      # accepts traffic before the backend serves /authorize does not merely stall
      # — it DENIES real agent requests and audits them. In the log those
      # startup-race denials are indistinguishable from policy decisions, which
      # dilutes the record this whole design exists to keep trustworthy. Gating on
      # health makes the audit log a record of decisions, not of boot ordering.
      #
      # KNOWN LIMIT, and `restart: always` above makes it matter more: depends_on
      # governs `docker compose up` ONLY. Restart-policy restarts are per-container
      # and the daemon honours no ordering between them, so after a host reboot
      # these three come back in whatever order they come back in, and this proxy
      # can be serving before the control plane is healthy. The gate is real for the
      # path a human drives and absent for the path a power cycle drives — which is
      # now the more common one. The resulting denials are correct (fail-closed) and
      # carry `control-plane unreachable, fail-closed` as their reason, so they are
      # at least distinguishable from policy decisions in the audit view; that
      # distinguishability is what stands in for ordering here.
      control-plane:
        condition: service_healthy
    # The proxy resolves the (public) allowlisted targets itself, via egress-net.
    # Default to public resolvers; override in a .env (EGRESS_DNS_PRIMARY/
    # SECONDARY) for locked-down / corporate networks where those are blocked.
    dns:
      - ${EGRESS_DNS_PRIMARY:-8.8.8.8}
      - ${EGRESS_DNS_SECONDARY:-8.8.4.4}
    volumes:
      - egress-audit:/var/log/egress
    # mitmdump is a forward proxy, so there is no HTTP health endpoint to hit —
    # the probe is a plain TCP connect to the listener, which catches the one
    # failure the container's own exit does not: process alive, listener wedged.
    # (Misconfiguration is already covered — the addon's _assert_guard_configured()
    # refuses to start, so the container dies visibly.)
    #
    # Deliberately NOT a real CONNECT through the proxy. That would prove the whole
    # policy path end to end, but it would also write an audit record every
    # interval, and a periodic synthetic `deny` is exactly the signal a human
    # reviewing the log is watching for (while a probe against an ALLOWED host
    # would open a genuine outbound connection on a timer). A silent probe keeps
    # the audit log a record of the agent's traffic and nothing else.
    #
    # python3 is the interpreter mitmproxy itself runs on, so this adds no tooling
    # to the choke-point image.
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8080), 3).close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Blast-radius limits, NOT a boundary. Nothing here fails open under memory
    # pressure — kill the proxy and sandbox-net (internal) leaves the agent with no
    # egress at all. The point is narrower: the host OOM killer scores by footprint
    # and kills across the whole host, so an unbounded proxy under a connection
    # flood could get the CONTROL PLANE killed instead of itself. Capping each
    # container turns "the kernel picks a victim" into "the container that
    # misbehaved is the one contained". The agent cannot exhaust host RAM directly
    # (its launcher caps it — tier 1 at 4g, tier 2 at 2g), but it CAN drive proxy
    # memory through connection volume, which is the residual path this closes.
    #
    # Sized generously on purpose: these must never fire in normal operation. An
    # OOM-killed control plane makes the addon fail closed and write denials to the
    # audit log — the same pollution the health gating above exists to prevent.
    # This is the one infra service with a real growth path (per-connection
    # buffers), hence the larger share.
    #
    # memswap_limit == mem_limit disables swap for the container so the cap is
    # hard; WSL2 enables swap by default, and without this the limit leaks into it.
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256
    # A plain forward proxy needs no elevated privileges.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Control plane BACKEND — the governance authority (policy + audit), the
  # crown-jewel state. Fully internal: no sandbox-net (the agent has no route to
  # it), no egress-net, no published port. Zero non-internal surface.
  #
  # It is the ONE service on both internal networks, and it serves a DIFFERENT
  # surface on each: the human reaches the management API over control-net (via
  # the control-plane-ui frontend below, the only other member), and the egress
  # proxy reaches /authorize over authorize-net and can reach nothing else. Two
  # ports, two bind addresses, one process — see app.py's module docstring for
  # why the process cannot be split even though the sockets must be.
  control-plane:
    build:
      # Repo root so the Dockerfile can COPY the top-level policies/ seed.
      context: .
      dockerfile: control-plane/Dockerfile
    image: dockade-control-plane
    container_name: control-plane
    hostname: control-plane
    # See egress-proxy for why these three are `always`.
    restart: always
    networks:
      control-net:
        ipv4_address: 172.31.0.2
      authorize-net:
        ipv4_address: 172.29.0.2
    environment:
      # The management listener binds THIS ADDRESS ALONE, which is the mechanism
      # that keeps it off authorize-net — a wildcard bind would serve `resolve` to
      # the egress proxy, so app.py refuses to start on one. The authorize
      # listener binds the wildcard on purpose: it is the safe surface, and the
      # healthcheck below reaches it over loopback.
      CONTROL_MANAGE_BIND: 172.31.0.2
    volumes:
      - control-state:/var/lib/control-plane
      # The egress proxy's own audit file, READ-ONLY. Not all egress decisions are
      # made by /authorize — the relay guard, port gate, SNI anti-fronting check and
      # permanent-lifeline allow are decided locally in the proxy — so the control
      # plane tails this file and ingests those (see _drain_egress_audit). `:ro` is
      # the point: the proxy owns the record, and the reader must not be able to
      # rewrite the evidence it is reading.
      - egress-audit:/var/log/egress:ro
    # /healthz on the AUTHORIZE listener (8091), which is the one the proxy's
    # service_healthy gate is actually about. Probed over loopback, which reaches
    # it because that listener binds the wildcard; the management listener binds
    # 172.31.0.2 alone and is deliberately not probeable from here.
    #
    # `main` seeds the policy rules and expires stale approvals BEFORE either
    # socket binds, so "answers /healthz" is strictly later, and more meaningful,
    # than "container started". This is the health gate the other two services
    # wait on.
    #
    # Deliberately SHALLOW: it returns a static 200 without touching SQLite, so
    # healthy here means "serving", not "store verified". Deepening it to a
    # `SELECT 1` is defensible (a healthcheck failure only marks the container
    # unhealthy — compose does not restart on it), but it would also make the
    # proxy's service_healthy gate depend on disk state, so it is left as an
    # explicit choice rather than a default.
    #
    # urlopen raises on any non-2xx, so a bad status is a non-zero exit. python3
    # is the runtime itself — no curl/wget assumption about the slim base.
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # See egress-proxy for the rationale. uvicorn + SQLite is a small, flat
    # footprint (well under 100 MB in practice) — this is headroom, not a target.
    # Of the three it is the one that most needs to stay clear of its cap: this is
    # the governance authority, and an OOM here denies real agent traffic.
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Control plane UI FRONTEND — a distinct, stateless service (own lifecycle)
  # that serves the approval UI and reverse-proxies the API/SSE to the backend.
  # It carries the one unavoidable non-internal surface (the host-loopback UI
  # publish on control-ui-net) so the backend does not have to. On control-net
  # to reach the backend; NOT on sandbox-net (the agent must never reach it).
  # Holds no state — a governance decision never depends on it.
  control-plane-ui:
    build:
      context: ./control-plane-ui
    image: dockade-control-plane-ui
    container_name: control-plane-ui
    hostname: control-plane-ui
    # See egress-proxy for why these three are `always`.
    restart: always
    networks:
      # Reach the backend (internal, no egress).
      control-net:
      # Host-UI reachability only; not an egress path (see control-ui-net).
      control-ui-net:
    environment:
      CONTROL_BACKEND_URL: http://control-plane:8090
    # Human-only management surface, bound to host loopback (never 0.0.0.0):
    # reachable from the host browser, not from the sandbox or other machines.
    ports:
      - "127.0.0.1:8081:8090"
    depends_on:
      # Nothing fails closed here (the frontend is stateless and no governance
      # decision depends on it), so this gate is purely so the first page load
      # after `up` reaches a backend that can answer rather than a 502.
      control-plane:
        condition: service_healthy
    # Same shallow probe as the backend, and shallow ON PURPOSE: it checks only
    # that the frontend serves, NOT that the backend is reachable. Relaying that
    # upstream state would couple two services this design keeps separate — the
    # frontend holds no state, so a red here should mean "the UI is down", not
    # "something behind the UI is down". This is the only host-published surface,
    # so it is also the health a human actually reads off `docker compose ps`.
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # See egress-proxy for the rationale. A stateless relay — the smallest
    # footprint of the three, and the only one whose loss costs nothing but the
    # human's view (no governance decision depends on it).
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # ── Local LLM inference (UNGOVERNED data-plane tool) ────────────────────────
  # An ungoverned tool in DESIGN.md's taxonomy: exposed fully to the agent, no
  # policy, no approval — and therefore it MUST have no independent egress. That
  # holds by construction here: sandbox-net only (internal: true), never
  # egress-net, and models are pre-fetched on the host into a read-only bind
  # mount, so the service never makes an outbound request at all. Nothing to
  # govern because nothing leaves.
  #
  # The GPU device is granted to THIS container, never to the sandbox. The agent
  # reaches inference the same way it reaches every other capability: as a
  # service on the internal network. The sandbox keeps zero direct device access,
  # so the "never give the sandbox a direct path to anything" invariant holds.
  #
  # Accelerator-specific, so every variant is behind a compose PROFILE and none
  # starts with a plain `docker compose up -d`:
  #     docker compose --profile llm-intel  up -d    # Intel Arc / Xe (WSL2, SYCL)
  #     docker compose --profile llm-nvidia up -d    # NVIDIA (CUDA)
  #     docker compose --profile llm-vulkan up -d    # AMD or Intel (native Linux)
  # They are MUTUALLY EXCLUSIVE: all three bind the same sandbox-net address and
  # the same `llm` alias on purpose, so the agent's endpoint (http://llm:8080) and
  # the firewall's /32 allow are identical whichever accelerator the host has.
  # Enabling two profiles at once is an address conflict, and is meant to be.
  #
  # Reachable ONLY by tier 2 (run-opencode-sandbox.sh): its launcher discovers
  # this service's IP and the firewall's LOCAL mode grants that single /32 — it is
  # tier 2's one permitted destination (see sandbox-common/init-firewall.sh).
  # Tier 1 sandboxes hit the firewall's default REJECT for it, on purpose.
  llm-intel:
    profiles:
      - llm-intel
    image: ghcr.io/ggml-org/llama.cpp:server-intel
    container_name: llm-intel
    hostname: llm-intel
    restart: unless-stopped
    networks:
      sandbox-net:
        # Stable address so the sandbox firewall can allow a literal /32 rather
        # than the whole subnet (per-service /32s are tighter — see the firewall
        # NOTE). Keep in-subnet with sandbox-net's 172.30.0.0/24.
        ipv4_address: 172.30.0.20
        # Accelerator-independent name for the agent: always http://llm:8080.
        aliases:
          - llm
    # Intel GPU under WSL2 goes through the paravirtual D3D12 device — there is no
    # /dev/dri render node to pass. The in-image Intel NEO/Level Zero runtime
    # dlopen()s libdxcore.so from the host's WSL driver mount, hence both lines.
    devices:
      - /dev/dxg
    volumes:
      - /usr/lib/wsl:/usr/lib/wsl:ro
      # Pre-fetch GGUFs here on the host. Read-only: inference never writes.
      - ${DOCKADE_MODELS_DIR:-./models}:/models:ro
    environment:
      # Asks the Level Zero driver to report FREE device memory rather than total —
      # which matters on an iGPU, where "VRAM" is shared with the host and the
      # honest free figure is the one that prevents over-allocation.
      #
      # It does NOT work on this path, and the container log says so on every boot:
      # `ext_intel_free_memory is not supported (export/set ZES_ENABLE_SYSMAN=1 to
      # support), use total memory as free memory` — printed WITH the variable
      # already set, because the WSL2 paravirtual D3D12 device exposes no sysman
      # interface to enable. Kept anyway: harmless here, and correct on the native
      # Linux paths where the query does exist.
      #
      # The consequence is the reason `-c` is hand-sized below rather than trusted
      # to fit: llama.cpp is planning allocations against TOTAL shared memory as
      # though all of it were free, so it cannot warn about an overshoot. On this
      # host, 32768 fits and 64k does not, and only measurement establishes that.
      ZES_ENABLE_SYSMAN: "1"
    # Prepend the WSL driver dir to the image's OWN LD_LIBRARY_PATH (which points
    # at its oneAPI libs) — replacing it instead of prepending breaks the runtime
    # the image ships. `-l` gives a login shell, whose PATH omits /app, so the
    # binary is called by absolute path.
    #
    # DOCKADE_LLM_MODEL takes an obviously-bogus DEFAULT rather than compose's `:?`
    # required form, because compose interpolates the WHOLE FILE BEFORE profiles
    # select services — verified: with the variable empty, `docker compose up -d`
    # (no profile) failed on `services.llm-intel.entrypoint` and refused to start the
    # three infra services. A `:?` in a profile-gated service is therefore a
    # whole-project requirement, which is exactly what profiles are supposed to
    # prevent. The default keeps the failure where it belongs — llama-server exits
    # naming the variable, and only if you actually start an llm-* profile. Cost of
    # this shape: `restart: unless-stopped` will crash-loop that container instead of
    # failing once, so read the log rather than assuming the image is broken.
    #
    # --jinja is REQUIRED for tool calling (the template emits the tool-call
    # format). --reasoning defaults to `off` here because llama-server's own
    # default is `auto`, which on Qwen3.5 means thinking-on: a trivial prompt
    # produced 6,099 reasoning tokens over 7.4 minutes. Clients that can send
    # `chat_template_kwargs` per request can opt back in; opencode cannot, so the
    # server default is the only place to fix it. Set DOCKADE_LLM_REASONING=on to
    # restore thinking, and bound it with --reasoning-budget N (a hard token cap)
    # rather than leaving it unrestricted. See DESIGN.md "Local inference".
    #
    # -c 32768 is sized for AGENT harnesses: opencode's base prompt (system + tool
    # schemas) alone exceeds 8k, so a smaller window fails before the first user
    # turn. 32k costs ~4.6 GB of KV on top of ~5.5 GB of weights — fits the ~16.9 GB
    # shared pool with headroom; 64k does not. Do NOT use -c 0 (load from model):
    # this model's native window would try to allocate far past the pool.
    # --no-context-shift makes overflow a visible error instead of silently
    # discarding the oldest tokens — for an agent that means a failed request
    # rather than a corrupted conversation with its system prompt evicted. Earned
    # its place: the log shows it rejecting three oversized requests outright, and
    # opencode compacting and continuing after each. Loud and recoverable.
    # The client must be told a SMALLER number, not this one — it overshoots
    # whatever window it is given. See the headroom check in the Makefile.
    #
    # --parallel 1 because the PROMPT CACHE IS PER-SLOT. llama-server defaults to 4
    # slots and assigns requests by LRU, so a multi-turn agent conversation can land
    # on a slot that never saw it and re-prefill the whole history — turning a
    # once-per-session cost into a per-turn one. One slot keeps the prefix stable.
    # Concurrent requests then queue instead of running together, which is no real
    # loss: they contend for the same GPU anyway (measured ~331 tok/s prefill solo
    # vs ~22 tok/s with two in flight). Raise DOCKADE_LLM_SLOTS only for a genuinely
    # concurrent workload, accepting the cache churn.
    entrypoint:
      - /bin/bash
      - -lc
      - >
        export LD_LIBRARY_PATH=/usr/lib/wsl/lib:/app:$$LD_LIBRARY_PATH;
        exec /app/llama-server --host 0.0.0.0 --port 8080
        -m /models/${DOCKADE_LLM_MODEL:-DOCKADE_LLM_MODEL-is-unset.gguf}
        -ngl ${DOCKADE_LLM_NGL:-99} -c ${DOCKADE_LLM_CTX:-32768} --jinja --no-context-shift
        --parallel ${DOCKADE_LLM_SLOTS:-1}
        --reasoning ${DOCKADE_LLM_REASONING:-off}
    # llama-server's own /health separates the two states that actually matter
    # here: 503 while the GGUF is loading and offloading to the GPU, 200 once the
    # model is resident. That load is tens of seconds to minutes, so for THIS
    # service "container running" is badly misleading — hence the long
    # start_period, during which a failing probe does not count toward retries.
    # run-opencode-sandbox.sh gates on this before launching a tier-2 sandbox.
    #
    # Written against bash's /dev/tcp rather than curl because bash is the one
    # tool this image is PROVEN to have (the entrypoint above invokes it), while
    # curl's presence in the upstream llama.cpp image is not guaranteed. Note CMD
    # rather than CMD-SHELL: /dev/tcp is a bash builtin and the default shell is
    # not bash. HTTP/1.0 so the server closes the connection itself.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /health HTTP/1.0\r\n\r\n' >&3 &&
          head -n1 <&3 | grep -q '^HTTP/[0-9.]* 200'
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 300s
    # DELIBERATELY no mem_limit, unlike the three infra services above. Two ways a
    # naive cap misfires here:
    #   - llama.cpp mmaps the GGUF, so the weights are reclaimable page cache
    #     charged to this cgroup. A tight limit produces disk thrashing on every
    #     access rather than a clean OOM — a slow, hard-to-diagnose failure instead
    #     of a loud one.
    #   - on the Intel iGPU, "VRAM" is host RAM allocated through /dev/dxg by the
    #     driver, and whether those allocations are charged to this cgroup is not
    #     something to assume. Guessing wrong means an OOM-kill mid-load and, with
    #     restart: unless-stopped, a crash loop.
    # What actually bounds this service is -c and -ngl against the ~16.9 GB shared
    # pool (see DESIGN.md "Operational constraints"), which is a real budget rather
    # than a kill threshold. If you do add a cap, derive it from `docker stats`
    # during AND after a model load — not from arithmetic.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # NVIDIA variant — same contract, same address, same `llm` alias. Requires
  # nvidia-container-toolkit on the Docker host; that runtime injects the driver
  # libraries itself, so unlike the Intel path there is no device node or driver
  # bind mount to declare here.
  llm-nvidia:
    profiles:
      - llm-nvidia
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llm-nvidia
    hostname: llm-nvidia
    restart: unless-stopped
    networks:
      sandbox-net:
        ipv4_address: 172.30.0.20
        aliases:
          - llm
    gpus: all
    volumes:
      - ${DOCKADE_MODELS_DIR:-./models}:/models:ro
    # Same flags as the Intel variant, minus the driver-path export — see there for
    # why --jinja and --reasoning off are set.
    entrypoint:
      - /bin/bash
      - -lc
      - >
        exec /app/llama-server --host 0.0.0.0 --port 8080
        -m /models/${DOCKADE_LLM_MODEL:-DOCKADE_LLM_MODEL-is-unset.gguf}
        -ngl ${DOCKADE_LLM_NGL:-99} -c ${DOCKADE_LLM_CTX:-32768} --jinja --no-context-shift
        --parallel ${DOCKADE_LLM_SLOTS:-1}
        --reasoning ${DOCKADE_LLM_REASONING:-off}
    # Same probe and same rationale as the Intel variant — see there.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /health HTTP/1.0\r\n\r\n' >&3 &&
          head -n1 <&3 | grep -q '^HTTP/[0-9.]* 200'
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 300s
    # Also deliberately uncapped — see the Intel variant. The mmap argument applies
    # identically; the shared-memory one does not, because on a discrete GPU the
    # weights live in real VRAM, which a cgroup memory limit does not govern at all.
    # A cap here would bound only the host-side buffers, which are not the pressure.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Vulkan variant — the NATIVE-LINUX fallback, and the only AMD path here. Same
  # contract, same address, same `llm` alias as the other two.
  #
  # STATUS: designed, NOT VERIFIED ON HARDWARE. Written on a WSL2/Intel host where
  # Vulkan cannot bind (see DESIGN.md "Accelerator independence"), so the compose
  # wiring, flags and health probe are reasoned rather than measured. The two things
  # to expect trouble from on first real use are DOCKADE_RENDER_GID below and
  # whether the driver enumerates at all — check with:
  #     docker run --rm --device /dev/dri ghcr.io/ggml-org/llama.cpp:server-vulkan \
  #       /app/llama-server --list-devices
  #
  # Vendor-neutral on purpose: RADV (AMD) and ANV (Intel) are both userspace Mesa
  # drivers over the same DRM render node, so ONE profile covers AMD and
  # native-Linux Intel. It is NOT for WSL2 — there is no /dev/dri there and Vulkan
  # could only run through Mesa's Dozen shim over D3D12, which is why the Intel
  # variant above uses SYCL instead.
  #
  #     docker compose --profile llm-vulkan up -d llm-vulkan
  #
  # For an AMD DATACENTER card (MI2xx/MI3xx), ROCm/HIP is meaningfully faster than
  # Vulkan on long context, MoE, and multi-GPU. That is a manual swap, not a fourth
  # profile: upstream ggml-org publishes no ROCm tag, so it means AMD's own image
  # (rocm/llama.cpp:...-server) plus /dev/kfd in addition to /dev/dri. Not carried
  # here because it would be a second unverifiable path, and the ROCm images are
  # validated only for MI-series hardware anyway.
  llm-vulkan:
    profiles:
      - llm-vulkan
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    container_name: llm-vulkan
    hostname: llm-vulkan
    restart: unless-stopped
    networks:
      sandbox-net:
        ipv4_address: 172.30.0.20
        aliases:
          - llm
    # The DRM render node is all a Vulkan driver needs — /dev/kfd is the ROCm/HIP
    # compute node and is deliberately NOT granted, since nothing here uses HIP.
    # Keeping the grant to the render node (no /dev/dri/card*, no modesetting) is
    # the smallest device capability that can serve inference.
    devices:
      - /dev/dri/renderD128
    volumes:
      - ${DOCKADE_MODELS_DIR:-./models}:/models:ro
    # renderD128 is typically root:render 0660, so the container process must hold
    # that group. group_add accepts a NAME or a NUMBER, and only the NUMBER crosses
    # the container boundary usefully: a name is resolved in the CONTAINER's
    # /etc/group (userspace), while the kernel checks the numeric gid against the
    # device node's owner. So a name either fails to resolve in the image, or
    # resolves to a DIFFERENT number than the host's (container `video`=44 vs host
    # `render`=104) and silently fails the permission check. Pass the HOST's gid;
    # it varies by distro (often 104 on Debian/Ubuntu, 105/109 elsewhere):
    #     getent group render | cut -d: -f3      # or `video` on older setups
    # and set DOCKADE_RENDER_GID in .env. Assumes rootful Docker — under
    # userns-remap or rootless, gids are remapped and this needs rethinking.
    #
    # No numeric default is guessed, because a WRONG gid degrades silently to CPU
    # rather than erroring. But this deliberately does NOT use the `:?` required-
    # variable form either: compose interpolates the WHOLE file before profiles
    # select services, so a `:?` here can make a plain `docker compose up -d` fail
    # for the infra services on any host that never intends to run this profile.
    # The default is instead an unresolvable group NAME, which scopes the failure to
    # this container's creation — docker resolves supplementary group names against
    # the container's /etc/group and rejects one it cannot find, naming the variable
    # back to you. If a docker version ignores it instead of erroring, the symptom is
    # the CPU-fallback trap described above, which the --list-devices check catches.
    group_add:
      - "${DOCKADE_RENDER_GID:-DOCKADE_RENDER_GID-is-unset}"
    # Same flags as the Intel variant, minus the WSL driver-path export — see there
    # for why --jinja, --no-context-shift, --parallel 1 and --reasoning off are set.
    # -ngl 99 assumes the weights fit; on a discrete card check against real VRAM
    # rather than the shared-pool arithmetic in DESIGN.md, which is iGPU-specific.
    entrypoint:
      - /bin/bash
      - -lc
      - >
        exec /app/llama-server --host 0.0.0.0 --port 8080
        -m /models/${DOCKADE_LLM_MODEL:-DOCKADE_LLM_MODEL-is-unset.gguf}
        -ngl ${DOCKADE_LLM_NGL:-99} -c ${DOCKADE_LLM_CTX:-32768} --jinja --no-context-shift
        --parallel ${DOCKADE_LLM_SLOTS:-1}
        --reasoning ${DOCKADE_LLM_REASONING:-off}
    # Same probe and same rationale as the Intel variant — see there. Note this one
    # can go 200 with NO GPU at all: if the driver fails to enumerate, llama.cpp
    # falls back to CPU and serves happily at a fraction of the speed. So a healthy
    # container is not evidence of acceleration — read the startup log for the
    # Vulkan device line, or run --list-devices as shown above.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /health HTTP/1.0\r\n\r\n' >&3 &&
          head -n1 <&3 | grep -q '^HTTP/[0-9.]* 200'
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 300s
    # Uncapped for the same reasons as the other two — the mmap'd-weights argument
    # is backend-independent, and on an APU/iGPU the shared-memory argument applies
    # as written for Intel.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
